# Deterministic PR-quality gates — no LLM/agent judgment, pure rule checks.
# These substitute for the human reviewer a solo maintainer doesn't have:
#   - title:     PR title must follow Conventional Commits (load-bearing for squash-merge)
#   - no-binary: block committed compiled/library artifacts (reinforces Binary-Artifacts + fixture policy)
#   - ai-label:  label (never block) PRs whose commits disclose AI co-authorship
#   - one-open-pr: close a second concurrently-open PR from the same author
#   - accepted-issue: close a PR with no linked issue; fail one whose issue
#                     is unapproved or assigned to someone else
#   - has-test:      a fix/feat PR must add at least one test
#
# The last two are intake gates. They exist because review is serial (one
# maintainer) while submission is not, so without a cap the queue is bounded
# only by the maintainer's endurance. Both decide on mechanical facts — how many
# PRs an author has open, whether a maintainer replied on the issue — so neither
# requires judgment, and neither costs maintainer time to apply.
#
# Security: uses `pull_request_target` for write access on fork PRs, but only
# reads strings from the event payload / REST API via github-script and never
# checks out or runs PR code, and never interpolates untrusted input into a
# shell — so there is no injection surface (only integer PR numbers appear in
# `${{ }}`).
name: PR quality gates

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const conventional = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,\-_ /]+\))?!?: .+/;
            const release = /^Release v?\d+\.\d+/;   // maintainer release PRs
            if (conventional.test(title) || release.test(title)) return;
            core.setFailed(
              'PR title must follow Conventional Commits — e.g. "fix(text): …", "feat: …", ' +
              '"docs: …" (or a "Release vX.Y.Z …" title). Got: "' + title + '"'
            );

  no-binary:
    name: No compiled / binary artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Compiled libraries / bytecode / executables — build from source,
            // ship via release assets. (PDFs are handled by fixture-hygiene;
            // fonts/images/ICC are legitimate fixtures and intentionally allowed.)
            const disallowed = /\.(so|dll|dylib|a|rlib|o|class|pyc|pyo|exe|wasm|jar|node|dSYM)$/i;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const offenders = files
              .filter(f => f.status === 'added' && disallowed.test(f.filename))
              .map(f => f.filename);
            if (offenders.length) {
              core.setFailed(
                'These compiled/binary artifacts must not be committed:\n' +
                offenders.map(f => '  - ' + f).join('\n')
              );
            }

  ai-label:
    name: Label AI-assisted contributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Label (never block) — disclosed AI co-authorship is legitimate;
            // this is for reviewer routing/metrics. Catches only *disclosed* AI
            // (trailers / an Assisted-by line); undisclosed use is undetectable.
            const marker = /(co-authored-by:[^\n]*(claude|copilot|cursor|devin|chatgpt|gpt|gemini|codex)|assisted-by:)/i;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const body = context.payload.pull_request.body || '';
            const disclosed = marker.test(body) || commits.some(c => marker.test(c.commit.message || ''));
            if (!disclosed) return;
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            };
            const existing = (await github.rest.issues.listLabelsOnIssue(common)).data.map(l => l.name);
            if (!existing.includes('ai-assisted')) {
              await github.rest.issues.addLabels({ ...common, labels: ['ai-assisted'] });
            }

  one-open-pr:
    name: One open PR per contributor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // Maintainers and collaborators are exempt: the limit rations
            // *review* capacity, and they supply it rather than consume it.
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (exempt.includes(pr.author_association)) return;
            if (pr.draft) return;   // drafts are not asking for review yet
            // Trivial classes named in CONTRIBUTING as not counting.
            if (/^(docs|ci|chore|revert)(\(|:)/i.test(pr.title || '')) return;
            // These intake rules took effect when CONTRIBUTING.md landed. A PR
            // opened before that could not have complied with them, so applying
            // them retroactively rejects work for failing a rule that did not
            // exist. Exempt anything older than the policy.
            const POLICY_EPOCH = Date.parse('2026-08-22T08:45:07Z');
            if (Date.parse(pr.created_at) < POLICY_EPOCH) {
              core.notice('PR predates the intake policy — exempt.');
              return;
            }

            // Post-once guard. These jobs re-run on every reopen and edit; without
            // it a contributor who reopens after correcting the PR is told the same
            // thing again. Never say the same thing twice on one PR.
            const sayOnce = async (marker, body) => {
              const prior = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100,
              });
              if (prior.some(c => (c.body || '').includes(marker))) {
                core.notice('Already commented on this PR — not repeating.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number,
                body: body + '\n\n<!-- ' + marker + ' -->',
              });
            };

            const others = (await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })).filter(p =>
              p.number !== pr.number &&
              p.user && p.user.login === pr.user.login &&
              !p.draft &&
              !/^(docs|ci|chore|revert)(\(|:)/i.test(p.title || '')
            );
            if (!others.length) return;

            const list = others.map(p => '#' + p.number).join(', ');
            await sayOnce('pr-quality:one-open-pr', [
                'Closing automatically: this project allows **one open pull request at a time**',
                'per non-maintainer contributor, and you already have ' + others.length + ' open (' + list + ').',
                '',
                'This is not a judgement about the change. Review here is serial — one maintainer,',
                'and every open PR needs a full read, a corpus sweep and a green CI cycle, and has to',
                'be re-checked each time something lands ahead of it. Several at once cost far more',
                'in total than the same work landed one at a time.',
                '',
                'Please reopen this once your earlier PR resolves. If you have found other unrelated',
                'bugs meanwhile, **open issues** for them — the diagnosis is valuable on its own and',
                'costs far less to carry than an open PR.',
                '',
                'See [One open PR at a time](https://github.com/' + context.repo.owner + '/' +
                  context.repo.repo + '/blob/main/CONTRIBUTING.md#before-you-open-a-pull-request).',
            ].join('\n'));
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });

  accepted-issue:
    name: Linked issue is approved and assigned to you
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (exempt.includes(pr.author_association)) return;
            if (pr.draft) return;
            if (/^(docs|ci|chore|revert)(\(|:)/i.test(pr.title || '')) return;

            // These intake rules took effect when CONTRIBUTING.md landed. A PR
            // opened before that could not have complied with them, so applying
            // them retroactively rejects work for failing a rule that did not
            // exist. Exempt anything older than the policy.
            const POLICY_EPOCH = Date.parse('2026-08-22T08:45:07Z');
            if (Date.parse(pr.created_at) < POLICY_EPOCH) {
              core.notice('PR predates the intake policy — exempt.');
              return;
            }

            // Post-once guard. These jobs re-run on every reopen and edit; without
            // it a contributor who reopens after correcting the PR is told the same
            // thing again. Never say the same thing twice on one PR.
            const sayOnce = async (marker, body) => {
              const prior = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100,
              });
              if (prior.some(c => (c.body || '').includes(marker))) {
                core.notice('Already commented on this PR — not repeating.');
                return;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number,
                body: body + '\n\n<!-- ' + marker + ' -->',
              });
            };

            const author = pr.user && pr.user.login;
            const body = pr.body || '';
            // GitHub honours several closing forms, including a full issue URL
            // (`Closes https://github.com/o/r/issues/12`), which closes the issue
            // on merge exactly as `Closes #12` does. Matching only the short form
            // rejects a correctly-linked PR.
            const CLOSING = new RegExp(
              '(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s+' +
              '(?:#|GH-|https?://github\\.com/[\\w.-]+/[\\w.-]+/issues/)(\\d+)',
              'gi',
            );
            const refs = [...new Set(
              [...body.matchAll(CLOSING)].map(m => parseInt(m[1], 10))
            )];

            const docs = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo +
                         '/blob/main/CONTRIBUTING.md#before-you-open-a-pull-request';

            if (!refs.length) {
              // Distinguish "referenced the issue imperfectly" from "no issue at
              // all". Only the second is a drive-by, and only it is closed —
              // auto-closing costs the contributor a reopen, so it is reserved
              // for the unambiguous case.
              const anyIssueNumber = /#\d+/.test(body);
              if (anyIssueNumber) {
                return core.setFailed(
                  'This PR mentions an issue but does not link it in a closing form. Put ' +
                  '"Closes #NNN" in the PR description (not the commit message) so the issue ' +
                  'closes on merge and this check can find it. See ' + docs
                );
              }
              await sayOnce('pr-quality:linked-issue', [
                  'Closing automatically: this PR does not reference an issue.',
                  '',
                  'Work here starts from an issue that a maintainer has approved and assigned —',
                  'opening a pull request is not how work is claimed. This is not about the quality',
                  'of the change: it costs a maintainer one line to say "go ahead" or "we would fix',
                  'that differently", and it saves you writing a change that was never going to land.',
                  '',
                  'What to do:',
                  '',
                  '1. Open an issue describing the problem. A reproducer and one line is enough.',
                  '2. Wait for a maintainer to comment `/approve` and assign it to you.',
                  '3. Reopen this PR (or open a new one) with `Closes #NNN` in the description.',
                  '',
                  'Typo, documentation, CI and revert PRs are exempt and can be opened directly.',
                  '',
                  'See [Before you open a pull request](' + docs + ').',
              ].join('\n'));
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });
              return;
            }

            // Who counts as a maintainer is decided by actual repository
            // permission, not by `author_association` on a comment and not by
            // who happened to apply a label. Triage access is enough to add a
            // label but must NOT be enough to approve work.
            const permCache = new Map();
            const isMaintainer = async (login) => {
              if (!login) return false;
              if (permCache.has(login)) return permCache.get(login);
              let ok = false;
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner, repo: context.repo.repo, username: login,
                });
                ok = ['admin', 'maintain', 'write'].includes(data.permission);
              } catch (e) { ok = false; }   // not a collaborator at all
              permCache.set(login, ok);
              return ok;
            };

            const problems = [];
            for (const n of refs) {
              let issue, comments, events;
              try {
                issue = (await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: n,
                })).data;
                comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: n, per_page: 100,
                });
                events = await github.paginate(github.rest.issues.listEvents, {
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: n, per_page: 100,
                });
              } catch (e) {
                problems.push('#' + n + ': could not be read (wrong repo?)');
                continue;
              }

              // Build one chronological list of approval-affecting acts, so the
              // most recent maintainer verdict wins regardless of its form.
              const acts = [];
              for (const c of comments) {
                const m = (c.body || '').match(/^\s*\/(approve|unapprove)\b/mi);
                if (m) acts.push({
                  at: c.created_at,
                  by: c.user && c.user.login,
                  approve: m[1].toLowerCase() === 'approve',
                });
              }
              for (const e of events) {
                if ((e.event === 'labeled' || e.event === 'unlabeled') &&
                    e.label && e.label.name === 'approved') {
                  acts.push({
                    at: e.created_at,
                    by: e.actor && e.actor.login,
                    approve: e.event === 'labeled',
                  });
                }
              }
              acts.sort((a, b) => new Date(a.at) - new Date(b.at));

              let approved = false;
              let selfApproveAttempt = false;
              for (const a of acts) {
                if (!(await isMaintainer(a.by))) {
                  if (a.approve) selfApproveAttempt = true;   // ignored, but worth saying
                  continue;
                }
                approved = a.approve;
              }

              const assignees = (issue.assignees || []).map(a => a.login);
              const assignedToAuthor = assignees.includes(author);

              if (!approved) {
                problems.push(
                  '#' + n + ': not approved by a maintainer' +
                  (selfApproveAttempt
                    ? ' (an `/approve` or `approved` label from someone without write access does not count)'
                    : ' — a maintainer must comment `/approve`')
                );
              } else if (!assignedToAuthor) {
                problems.push(
                  '#' + n + ': approved, but assigned to ' +
                  (assignees.length ? assignees.map(a => '@' + a).join(', ') : 'nobody') +
                  ' rather than @' + author
                );
              } else {
                return;   // one fully-satisfying issue is enough
              }
            }

            core.setFailed(
              'The linked issue is not cleared for implementation:\n' +
              problems.map(p => '  - ' + p).join('\n') +
              '\n\nA maintainer approves an issue by commenting `/approve` and assigning it to ' +
              'whoever will implement it. Assignment is how work is claimed here — it prevents two ' +
              'people building the same fix, and it means the maintainer has agreed both the ' +
              'approach and who is doing it. See ' + docs
            );

  has-test:
    name: Change ships a test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) return;
            // Only behaviour changes need a test. Docs/CI/chore/revert/perf-only
            // and pure refactors are judged by the reviewer, not here.
            if (!/^(fix|feat)(\(|!|:)/i.test(pr.title || '')) return;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            // A test is a new #[test]/#[tokio::test]/#[rstest] attribute anywhere
            // in the diff — this crate keeps unit tests inline under #[cfg(test)]
            // as well as in tests/, so looking only at tests/ would be wrong.
            const addsTest = files.some(f =>
              (f.patch || '')
                .split('\n')
                .some(l => /^\+\s*#\[(tokio::)?(test|rstest)\b/.test(l))
            );
            if (addsTest) return;

            const touchesTestFile = files.some(f =>
              f.filename.startsWith('tests/') && f.status !== 'removed'
            );

            core.setFailed(
              (touchesTestFile
                ? 'This PR changes files under tests/ but does not add a new test case. '
                : 'This PR does not add a test. ') +
              'Every bug fix ships a regression test that fails without the fix, added in a ' +
              'commit before the fix commit. If this change genuinely cannot be tested — a ' +
              'pure refactor, or a defect only reproducible on a document that cannot be ' +
              'shared — say so in the PR description and a maintainer will waive this. ' +
              'See https://github.com/' + context.repo.owner + '/' + context.repo.repo +
              '/blob/main/CONTRIBUTING.md#testing-and-regression-requirements'
            );

  # ---------------------------------------------------------------------------
  # The regression test must actually fail without the fix.
  #
  # CONTRIBUTING.md §1 has always required this and said "CI checks it". Until
  # now CI only checked that a test was *added* (see `has-test` above), not that
  # it discriminates. A review of ~60 merged and closed changes found 21 that
  # shipped a test which passes with the fix reverted — in six cases the test
  # demonstrating the headline claim. This job closes that gap.
  #
  # It leans on the test-commit-before-fix-commit ordering CONTRIBUTING.md
  # already mandates: check out the commit that introduces the test, run only
  # the tests it adds, and require them to fail. No revert heuristics are
  # needed, because the contributor has already separated the two.
  #
  # Scoped to `fix(...)` deliberately. A `feat(...)` test may legitimately fail
  # to *compile* before its API exists, which is not the same thing as a test
  # that proves nothing.
  revert-check:
    name: New test fails without the fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        id: scope
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) { core.setOutput('run', 'false'); return; }
            if (!/^fix(\(|!|:)/i.test(pr.title || '')) { core.setOutput('run', 'false'); return; }
            const body = (pr.body || '').toLowerCase();
            // Same waiver the has-test gate honours: a maintainer accepts a
            // written justification in the PR description.
            if (body.includes('no-revert-check')) {
              core.notice('revert-check waived by PR description (no-revert-check).');
              core.setOutput('run', 'false');
              return;
            }
            core.setOutput('run', 'true');

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          fetch-depth: 0

      - name: Locate the test commit and the tests it adds
        if: steps.scope.outputs.run == 'true'
        id: find
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # First commit in the PR that introduces a test attribute.
          TEST_COMMIT=""
          for sha in $(git rev-list --reverse "$BASE..$HEAD"); do
            if git show "$sha" -- '*.rs' | grep -qE '^\+\s*#\[(tokio::)?(test|rstest)\b'; then
              TEST_COMMIT="$sha"
              break
            fi
          done

          if [ -z "$TEST_COMMIT" ]; then
            echo "No commit in this PR adds a test; the has-test gate covers that." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Names of the test functions added by that commit.
          NAMES=$(git show "$TEST_COMMIT" -- '*.rs' \
            | grep -A3 -E '^\+\s*#\[(tokio::)?(test|rstest)\b' \
            | grep -oE '^\+\s*(async )?fn [a-z0-9_]+' \
            | sed -E 's/^\+\s*(async )?fn //' | sort -u)

          if [ -z "$NAMES" ]; then
            echo "Could not name the added tests; skipping rather than guessing." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "test_commit=$TEST_COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo "names<<EOF"
            echo "$NAMES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        if: steps.scope.outputs.run == 'true' && steps.find.outputs.skip == 'false'
        with:
          rustflags: ''

      - name: Require each new test to fail at the test commit
        if: steps.scope.outputs.run == 'true' && steps.find.outputs.skip == 'false'
        run: |
          set -uo pipefail
          git checkout --quiet "${{ steps.find.outputs.test_commit }}"

          PASSED=""
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            echo "::group::$name"
            # No `--exact`: libtest matches it against the FULL test path, so an
            # `--exact` filter of a bare fn name silently matches NOTHING for any
            # unit test inside `mod tests` (verified: "running 0 tests, 1 filtered
            # out"). That would make this gate pass every such PR without ever
            # running the test. Filter by substring, then confirm the exact test
            # below by matching its printed line.
            OUT=$(cargo test --no-fail-fast "$name" 2>&1) || true
            echo "$OUT"
            echo "::endgroup::"

            if echo "$OUT" | grep -qE '^(error(\[E[0-9]+\])?|error: could not compile)'; then
              echo "::notice::'$name' does not compile at the test commit — its test depends on the fix's API. Treated as a legitimate ordering exception."
              continue
            fi
            # Anchor on the whole printed line and allow an optional module path,
            # so `foo` is not credited when only `foo_bar` ran.
            if echo "$OUT" | grep -qE "^test ([A-Za-z0-9_]+::)*$name \.\.\. ok$"; then
              PASSED="$PASSED $name"
            fi
          done <<< "${{ steps.find.outputs.names }}"

          if [ -n "$PASSED" ]; then
            echo "::error::These tests PASS without the fix, so they do not prove it:$PASSED"
            echo ""
            echo "A regression test must go red when the fix is absent — CONTRIBUTING.md §1."
            echo "A test that passes either way gives false confidence and is worse than no test."
            echo ""
            echo "Common causes found in review:"
            echo "  * the fixture's geometry or values happen to satisfy the assertion already"
            echo "  * the assertion checks a call returned, not the effect a user sees"
            echo "  * the expected value is computed by calling the code under test"
            echo "  * the fixture carries data the code under test never reads"
            echo ""
            echo "If this test genuinely cannot fail without the fix, say why in the PR"
            echo "description and include 'no-revert-check' for a maintainer to waive."
            exit 1
          fi

          echo "All newly added tests fail at the test commit, as required."
