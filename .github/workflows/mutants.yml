name: Mutants

# cargo-mutants measures what the revert-check gate measures one hunk at a
# time: whether the tests notice when the code changes. On a pull request it
# runs only on the mutants the diff creates, and reports without blocking; the
# weekly run covers the library and is where the surviving-mutant rate is read.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/mutants.yml'

permissions:
  contents: read

jobs:
  mutants:
    name: Mutants (${{ github.event_name == 'pull_request' && 'in diff' || 'library' }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ''

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Mutants in the pull request's diff
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- src/ > pr.diff
          cargo mutants --in-diff pr.diff --timeout 300 --no-shuffle -- --lib

      - name: Mutants across the library
        if: github.event_name != 'pull_request'
        run: cargo mutants --timeout 300 --no-shuffle -- --lib

      - name: Report
        if: always()
        run: |
          {
            echo "### cargo-mutants"
            for f in caught missed timeout unviable; do
              [ -f "mutants.out/$f.txt" ] && echo "- $f: $(wc -l < mutants.out/$f.txt)"
            done
            if [ -f mutants.out/missed.txt ] && [ -s mutants.out/missed.txt ]; then
              echo ""; echo "Missed (the tests did not notice):"; echo '```'; head -40 mutants.out/missed.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore
